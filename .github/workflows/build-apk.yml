name: Build Laz B Empire APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true
      - name: Create Android project
        run: |
          flutter create --platforms=android --org com.lazbempire /tmp/laz_app
          rm -rf /tmp/laz_app/lib
          cp -R flutter_app/lib /tmp/laz_app/lib
          cp flutter_app/pubspec.yaml /tmp/laz_app/pubspec.yaml
          cd /tmp/laz_app
          flutter pub get
      - name: Build release APK
        run: |
          cd /tmp/laz_app
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: laz-b-empire-apk
          path: /tmp/laz_app/build/app/outputs/flutter-apk/app-release.apk
