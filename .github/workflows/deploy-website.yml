name: Deploy Laz B Empire Websites
on:
  workflow_dispatch:
  push:
    branches: ["main"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare websites
        run: |
          rm -rf _site
          mkdir -p _site/customer _site/owner
          cp website/customer/index.html _site/customer/
          cp website/customer.js _site/
          cp website/owner/index.html _site/owner/
          cp website/owner.js _site/
          cp website/shared.css _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
